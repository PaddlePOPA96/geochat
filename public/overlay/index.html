<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MabarBang OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script>if (typeof io === 'undefined') { document.write('<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"><\/script>'); }</script>
  <style>
    :root {
      --card-yellow: #ffe082;
      --card-green: #c8f560;
      --card-pink: #ffb3c6;
      --card-blue: #70d6ff;
      --card-coral: #ff5964;
      --card-white: #ffffff;
      --border-thick: 3.5px solid #000000;
      --border-med: 2.5px solid #000000;
      --shadow-solid: 6px 6px 0px #000000;
      --radius-card: 20px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: transparent;
      color: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 24px;
    }

    /* Scoreboard Widget */
    .overlay-widget {
      width: 360px;
      background: var(--card-white);
      border: var(--border-thick);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-solid);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9) translateY(-10px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .widget-header {
      padding: 12px 18px;
      background: var(--card-yellow);
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 30px;
      height: 30px;
      background: var(--card-coral);
      border: var(--border-med);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      box-shadow: 2px 2px 0px #000;
      transform: rotate(-3deg);
    }

    .header-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.4px;
      color: #000;
    }

    .round-tag {
      font-size: 11px;
      font-weight: 900;
      background: #ffffff;
      border: 2px solid #000;
      color: #000;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      box-shadow: 2px 2px 0px #000;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-bar {
      padding: 7px 18px;
      background: var(--card-green);
      border-bottom: 2px solid #000;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      transition: background 0.2s ease;
    }

    .status-bar.closed {
      background: #f1f5f9;
      color: #64748b;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid #000;
      background: #22c55e;
    }

    .status-bar.closed .status-dot {
      background: #ef4444;
    }

    /* List Rows */
    .players-list {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1.5px solid #e2e8f0;
      animation: rowSlideIn 0.25s ease-out;
    }

    @keyframes rowSlideIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .player-row:nth-child(even) {
      background: #fafaf9;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .rank-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #000;
      box-shadow: 2px 2px 0px #000;
      font-weight: 900;
      font-size: 11px;
      flex-shrink: 0;
    }

    .rank-1 { background: #ffd166; color: #000; }
    .rank-2 { background: #70d6ff; color: #000; }
    .rank-3 { background: #ff9ebb; color: #000; }
    .rank-other { background: #e2e8f0; color: #000; }

    .player-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #000;
      background: #f1f5f9;
      flex-shrink: 0;
    }

    .player-name {
      font-size: 13px;
      font-weight: 800;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .player-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .player-score {
      font-size: 12px;
      font-weight: 900;
      color: #000;
      background: #bbf7d0;
      border: 1.5px solid #000;
      border-radius: 6px;
      padding: 1px 6px;
      box-shadow: 1.5px 1.5px 0px #000;
    }

    .player-dist {
      font-size: 10px;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      border: 1px solid #000;
      border-radius: 4px;
      padding: 0 4px;
    }

    .empty-row {
      padding: 24px 16px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
    }

    /* Notification Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 9999;
    }

    .toast {
      background: #ffffff;
      border: 2.5px solid #000000;
      border-radius: 14px;
      box-shadow: 4px 4px 0px #000000;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #000;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) 3.7s forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(10px) scale(0.95); }
    }

    /* ==========================================================================
       Solid Neobrutalism Intro Transition: MABAR BANG - kikobooo x arvana prod
       ========================================================================== */
    .intro-curtain {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: all;
    }

    .curtain-slab {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50.5%;
      z-index: 1;
      transition: transform 0.65s cubic-bezier(0.85, 0, 0.15, 1);
    }

    .curtain-top {
      top: 0;
      background: #ffe082;
      border-bottom: 5px solid #000;
      background-image: radial-gradient(#000000 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      transform: translateY(0);
    }

    .curtain-bottom {
      bottom: 0;
      background: #c8f560;
      border-top: 5px solid #000;
      background-image: radial-gradient(#000000 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      transform: translateY(0);
    }

    .intro-curtain.dismissed .curtain-top {
      transform: translateY(-101%);
    }

    .intro-curtain.dismissed .curtain-bottom {
      transform: translateY(101%);
    }

    .intro-card-wrap {
      position: relative;
      z-index: 10;
      padding: 20px;
      transition: transform 0.45s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.35s ease;
    }

    .intro-curtain.dismissed .intro-card-wrap {
      transform: scale(0.6) rotate(-3deg);
      opacity: 0;
      pointer-events: none;
    }

    .intro-card {
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 28px;
      box-shadow: 10px 10px 0px #000000;
      padding: 36px 28px 28px;
      max-width: 520px;
      width: 90vw;
      text-align: center;
      position: relative;
      animation: popIntro 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIntro {
      0% {
        transform: scale(0.6) rotate(-6deg);
        opacity: 0;
      }
      70% {
        transform: scale(1.04) rotate(1deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .intro-sticker {
      position: absolute;
      font-size: 11px;
      font-weight: 900;
      border: 2px solid #000;
      border-radius: var(--radius-pill);
      padding: 3px 10px;
      box-shadow: 2.5px 2.5px 0px #000;
      letter-spacing: 0.5px;
      z-index: 5;
    }

    .sticker-tl {
      top: -12px;
      left: 16px;
      background: #70d6ff;
      color: #000;
      transform: rotate(-5deg);
    }

    .sticker-tr {
      top: -12px;
      right: 16px;
      background: #c8f560;
      color: #000;
      transform: rotate(4deg);
    }

    .intro-starburst {
      position: absolute;
      top: -20px;
      right: -14px;
      font-size: 38px;
      color: #ff5964;
      line-height: 1;
      text-shadow: 2px 2px 0px #000;
      animation: spinStar 10s linear infinite;
    }

    @keyframes spinStar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .intro-tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 2px solid #000;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
      margin-bottom: 10px;
    }

    .intro-title {
      font-size: clamp(34px, 7vw, 56px);
      font-weight: 900;
      letter-spacing: -2px;
      color: #000000;
      line-height: 1.05;
      margin: 6px 0 14px;
      text-transform: uppercase;
      transform: rotate(-1.5deg);
      text-shadow: 3px 3px 0px #ffe082, 5px 5px 0px #000000;
    }

    .intro-collab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ff5964;
      color: #ffffff;
      border: 2.5px solid #000000;
      border-radius: var(--radius-pill);
      padding: 8px 20px;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.5px;
      box-shadow: 3.5px 3.5px 0px #000000;
      margin-bottom: 14px;
      transform: rotate(1deg);
    }

    .collab-x {
      color: #ffe082;
      font-size: 13px;
      font-weight: 900;
    }

    .intro-subtext {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 18px;
    }

    .intro-bar-outer {
      width: 100%;
      max-width: 240px;
      height: 12px;
      background: #f8fafc;
      border: 2px solid #000000;
      border-radius: var(--radius-pill);
      margin: 0 auto 16px;
      overflow: hidden;
      box-shadow: 2px 2px 0px #000000;
    }

    .intro-bar-inner {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(45deg, #c8f560, #c8f560 10px, #bbf7d0 10px, #bbf7d0 20px);
      border-right: 2px solid #000000;
      animation: fillProgress 1.6s ease-in-out forwards;
    }

    @keyframes fillProgress {
      0% { width: 0%; }
      60% { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Solid Neobrutalism Intro Curtain & Transition -->
  <div id="intro-curtain" class="intro-curtain" onclick="dismissIntro()">
    <div class="curtain-slab curtain-top"></div>
    <div class="curtain-slab curtain-bottom"></div>

    <div class="intro-card-wrap">
      <div class="intro-card" onclick="event.stopPropagation()">
        <div class="intro-sticker sticker-tl">✦ MABARBANG ✦</div>
        <div class="intro-sticker sticker-tr">★ 2026 EDITION ★</div>
        <div class="intro-starburst">✹</div>

        <div class="intro-tag-pill">
          LIVE STREAMING ENGINE
        </div>

        <h1 class="intro-title">MABAR BANG</h1>

        <div class="intro-collab-badge">
          <span>⚡</span>
          <span>kikobooo</span>
          <span class="collab-x">✕</span>
          <span>arvana prod</span>
          <span>⚡</span>
        </div>

        <p class="intro-subtext">MabarBang • Interaktif YouTube Live Guessing Game</p>

        <div class="intro-bar-outer">
          <div class="intro-bar-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay-widget">
    <div class="widget-header">
      <div class="header-left">
        <div class="header-logo">▶</div>
        <div class="header-title" id="mapTitle">MabarBang Live</div>
      </div>
      <div class="round-tag" id="roundTag">R1 / 5</div>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Guesses Closed</span>
      </div>
      <div style="font-weight: 800;" id="totalGuessesText">0 Guesses</div>
    </div>

    <div class="players-list" id="playersList">
      <div class="empty-row">Ketik <code>!g lat, lng</code> atau <code>!g [negara]</code> di chat!</div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const socket = io();
    let currentState = null;

    // Intro Transition handling
    const urlParams = new URLSearchParams(window.location.search);
    const disableIntro = urlParams.get('intro') === '0';

    let introDismissed = false;
    function dismissIntro() {
      if (introDismissed) return;
      introDismissed = true;
      const curtain = document.getElementById('intro-curtain');
      if (!curtain) return;
      curtain.classList.add('dismissed');
      setTimeout(() => {
        curtain.style.display = 'none';
        curtain.style.pointerEvents = 'none';
      }, 700);
    }

    if (disableIntro) {
      const curtain = document.getElementById('intro-curtain');
      if (curtain) curtain.style.display = 'none';
    } else {
      setTimeout(() => {
        dismissIntro();
      }, 1800);
    }

    socket.on('state-update', (state) => {
      currentState = state;
      renderOverlay();
    });

    socket.on('guess-added', ({ guess, totalGuesses }) => {
      showToast(guess);
      document.getElementById('totalGuessesText').textContent = totalGuesses + ' Guesses';
    });

    socket.on('guesses-batch', ({ guesses, totalGuesses }) => {
      if (Array.isArray(guesses) && guesses.length > 0) {
        // Only toast the latest 2 guesses to prevent OBS DOM clutter
        const recent = guesses.slice(-2);
        recent.forEach((g) => showToast(g));
      }
      document.getElementById('totalGuessesText').textContent = totalGuesses + ' Guesses';
    });

    function renderOverlay() {
      if (!currentState) return;

      document.getElementById('mapTitle').textContent = currentState.mapName || 'GeoGuessr';
      document.getElementById('roundTag').textContent = `R${currentState.round} / 5`;

      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');

      if (currentState.guessesOpen) {
        statusBar.className = 'status-bar';
        statusText.textContent = 'Guesses Open';
      } else {
        statusBar.className = 'status-bar closed';
        statusText.textContent = 'Guesses Closed';
      }

      const list = currentState.roundGuesses || [];
      document.getElementById('totalGuessesText').textContent = list.length + ' Guesses';

      const container = document.getElementById('playersList');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-row">Ketik <code>!g [negara/kota]</code> di YouTube chat!</div>';
        return;
      }

      let html = '';
      list.slice(0, 10).forEach((p, idx) => {
        const rank = idx + 1;
        let rankClass = 'rank-other';
        if (rank === 1) rankClass = 'rank-1';
        else if (rank === 2) rankClass = 'rank-2';
        else if (rank === 3) rankClass = 'rank-3';

        const avatar = p.avatar ? `<img class="player-avatar" src="${p.avatar}" alt="" />` : `<div class="player-avatar" style="display:flex;align-items:center;justify-content:center;font-size:10px;">👤</div>`;
        const isDonation = p.platform === 'geoindo' || p.platform === 'Tako' || (p.userId && p.userId.startsWith('geoindo_'));
        const donBadge = isDonation ? '<span style="background: #10b981; color: #fff; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 99px; border: 1px solid #000; margin-left: 4px;">💸</span>' : '';

        html += `
          <div class="player-row" style="${isDonation ? 'background: #f0fdf4;' : ''}">
            <div class="player-left">
              <span class="rank-pill ${rankClass}">${rank}</span>
              ${avatar}
              <span class="player-name">${escapeHtml(p.username)}</span>
              ${donBadge}
            </div>
            <div class="player-right">
              <span class="player-score">${p.score.toLocaleString()}</span>
              <span class="player-dist">${p.distance} km</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function showToast(guess) {
      const container = document.getElementById('toastContainer');
      // Limit max 4 toasts on screen
      while (container.children.length >= 4) {
        container.removeChild(container.firstChild);
      }
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <span style="font-size: 18px;">🎯</span>
        <div>
          <strong style="font-size: 13px; color: #000;">${escapeHtml(guess.username)}</strong>
          <div style="font-size: 11px; font-weight: 800; color: #059669; font-family: 'JetBrains Mono', monospace;">
            ${guess.score} pts • ${guess.distance} km
          </div>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
